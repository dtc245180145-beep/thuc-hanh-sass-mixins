
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thực hành SASS Variables và Mixins</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Thực hành SASS Variables và Mixins</h1>
    <h2>Tối ưu CSS bằng SASS</h2>

    <section class="card">
      <h2>Thẻ nội dung thứ nhất</h2>
      <p>
        SASS variables giúp quản lý màu sắc và kích thước.
        Mixins giúp tái sử dụng các nhóm thuộc tính CSS.
      </p>
      <button class="button">Tìm hiểu thêm</button>
    </section>

    <section class="card">
      <h2>Thẻ nội dung thứ hai</h2>
      <p>
        Khi cần thay đổi giao diện, bạn có thể cập nhật
        biến hoặc mixin thay vì sửa nhiều vị trí.
      </p>
      <button class="button">Xem chi tiết</button>
    </section>
  </main>

</html>
